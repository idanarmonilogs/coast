<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a1421">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="חופים">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>חופים — גלים, רוח, קרינה</title>
<style>
:root{
  --bg-1:#0a1421; --bg-2:#10243d;
  --card:rgba(255,255,255,.06);
  --card-2:rgba(255,255,255,.075);
  --border:rgba(255,255,255,.11);
  --text:#f1f5fa; --text-2:#bccadb; --text-3:#7a8a9e;
  --accent:#5dade2;
  --shadow:0 8px 32px rgba(0,0,0,.35);
  --uv-1:#76d275; --uv-2:#ffd54f; --uv-3:#ff9800; --uv-4:#f44336; --uv-5:#9c27b0;
  --wv-1:#76d275; --wv-2:#5dade2; --wv-3:#ffd54f; --wv-4:#ff9800; --wv-5:#f44336;
  --wn-1:#7fc3ff; --wn-2:#76d275; --wn-3:#ffd54f; --wn-4:#ff9800; --wn-5:#f44336;
}
.wn-l{--wn-color:var(--wn-1)} .wn-m{--wn-color:var(--wn-2)}
.wn-h{--wn-color:var(--wn-3)} .wn-v{--wn-color:var(--wn-4)} .wn-x{--wn-color:var(--wn-5)}
.sc-1{--sc-color:#f87171} .sc-2{--sc-color:#fbbf24}
.sc-3{--sc-color:#a3e635} .sc-4{--sc-color:#4ade80} .sc-5{--sc-color:#22d3ee}

/* === Surf Score Hero === */
.surf-hero{
  background:linear-gradient(135deg,rgba(255,255,255,.05) 0%,rgba(255,255,255,.02) 100%);
  border:.5px solid var(--border);border-radius:18px;
  padding:16px 18px;margin-bottom:12px;
  position:relative;overflow:hidden;
}
.surf-hero::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 85% 30%,var(--sc-color) 0%,transparent 55%);
  opacity:.18;pointer-events:none;
}
.surf-top{display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;z-index:1}
.surf-score-wrap{display:flex;align-items:baseline;gap:10px}
.surf-num{
  font-size:58px;font-weight:800;line-height:.95;letter-spacing:-2px;
  color:var(--sc-color);
  text-shadow:0 0 22px color-mix(in srgb,var(--sc-color) 45%,transparent);
}
.surf-num-max{font-size:19px;font-weight:600;color:var(--text-3)}
.surf-meta{display:flex;flex-direction:column;gap:3px}
.surf-cap{font-size:11px;color:var(--text-3);font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.surf-label{font-size:21px;font-weight:800;color:var(--sc-color);line-height:1}

.surf-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;position:relative;z-index:1}
.s-chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:6px 11px;
  background:rgba(0,0,0,.28);border:.5px solid var(--border);
  border-radius:11px;font-size:12px;font-weight:600;
  color:var(--text);white-space:nowrap;
}
.s-chip b{color:var(--chip-color,var(--accent));font-weight:700}
.s-chip-i{font-size:13px;line-height:1}

/* === Smart Insights Panel === */
.insights{
  background:var(--card);border:.5px solid var(--border);
  border-radius:16px;padding:6px;margin-bottom:12px;
  display:flex;flex-direction:column;gap:4px;
}
.ins{
  display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:10px;
  padding:10px 12px;background:var(--card-2);border-radius:11px;
  border:.5px solid transparent;
}
.ins.lv-good{border-color:rgba(74,222,128,.3);background:rgba(74,222,128,.07)}
.ins.lv-ok{border-color:rgba(93,173,226,.25);background:rgba(93,173,226,.06)}
.ins.lv-warn{border-color:rgba(251,191,36,.3);background:rgba(251,191,36,.07)}
.ins.lv-bad{border-color:rgba(248,113,113,.35);background:rgba(248,113,113,.08)}
.ins.lv-cold{border-color:rgba(125,211,252,.3);background:rgba(125,211,252,.07)}
.ins-i{font-size:18px;text-align:center;line-height:1}
.ins-k{font-size:11px;color:var(--text-3);font-weight:600;letter-spacing:.3px;text-transform:uppercase;line-height:1.1}
.ins-v{font-size:15px;font-weight:700;color:var(--text);line-height:1.25;margin-top:2px}
.ins-text{display:flex;flex-direction:column}
*:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg-1)}
body{
  background:radial-gradient(ellipse 80% 50% at 50% -10%,#1c3a5c 0%,var(--bg-1) 60%) fixed;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Hebrew","Segoe UI",system-ui,sans-serif;
  font-size:16px;line-height:1.4;min-height:100vh;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
  -webkit-font-smoothing:antialiased;
  font-feature-settings:"tnum","ss01";
}
header{
  padding:16px 18px 12px;display:flex;justify-content:space-between;align-items:center;
  position:sticky;top:0;z-index:10;
  background:rgba(10,20,33,.75);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--border);
}
h1{font-size:22px;font-weight:700;letter-spacing:-.5px;display:flex;align-items:center;gap:8px}
.head-right{display:flex;align-items:center;gap:10px}
.updated{font-size:11px;color:var(--text-3);text-align:left;line-height:1.3}
.refresh{
  background:rgba(93,173,226,.13);border:none;color:var(--accent);
  width:38px;height:38px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;cursor:pointer;transition:all .15s;
}
.refresh:active{background:rgba(93,173,226,.28);transform:scale(.92)}
.lang-btn{
  background:rgba(255,255,255,.06);border:.5px solid var(--border);color:var(--text);
  height:34px;padding:0 11px;border-radius:17px;
  font-size:12.5px;font-weight:700;font-family:inherit;
  display:flex;align-items:center;gap:4px;cursor:pointer;transition:all .15s;
}
.lang-btn:active{background:rgba(93,173,226,.2);transform:scale(.94)}
.refresh.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spot-picker{
  display:flex;gap:6px;padding:10px 14px 4px;overflow-x:auto;scrollbar-width:none;
  position:sticky;top:65px;z-index:9;
  background:rgba(10,20,33,.75);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
}
.spot-picker::-webkit-scrollbar{display:none}
.spot-btn{
  flex:0 0 auto;padding:10px 18px;min-height:40px;
  background:var(--card);border:.5px solid var(--border);
  color:var(--text);border-radius:20px;
  font-size:14px;font-weight:600;font-family:inherit;
  cursor:pointer;transition:all .18s;white-space:nowrap;
}
.spot-btn:active{transform:scale(.96)}
.spot-btn.active{background:var(--accent);color:#0a1421;border-color:var(--accent);font-weight:700}
.spot-edit{
  background:transparent;border:.5px dashed rgba(93,173,226,.5);
  color:var(--accent)!important;font-weight:700;
}
.spot-edit:active{background:rgba(93,173,226,.1)}

/* === Beach Manager Dialog === */
.beach-mgr{
  border:none;padding:0;border-radius:20px;
  background:#0f1f33;color:var(--text);
  width:min(440px,92vw);max-height:80vh;
  font-family:inherit;direction:rtl;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
}
.beach-mgr::backdrop{background:rgba(0,0,0,.6);backdrop-filter:blur(8px)}
.bm-head{
  display:flex;justify-content:space-between;align-items:center;
  padding:18px 20px;border-bottom:.5px solid var(--border);
  position:sticky;top:0;background:#0f1f33;z-index:1;
}
.bm-head h2{font-size:18px;font-weight:700;letter-spacing:-.3px}
.bm-close{
  background:var(--card);border:.5px solid var(--border);
  color:var(--text);font-size:18px;width:34px;height:34px;
  border-radius:50%;cursor:pointer;font-family:inherit;
}
.bm-body{padding:14px 16px;overflow-y:auto;max-height:calc(80vh - 130px)}
.bm-section{margin-bottom:14px}
.bm-region{
  font-size:12px;color:var(--text-3);font-weight:700;
  letter-spacing:.5px;text-transform:uppercase;
  padding:6px 4px;margin-bottom:6px;
}
.bm-row{
  display:flex;align-items:center;gap:10px;
  padding:11px 14px;margin-bottom:5px;
  background:var(--card-2);border:.5px solid var(--border);
  border-radius:11px;cursor:pointer;transition:all .15s;
  min-height:44px;
}
.bm-row:hover{background:rgba(255,255,255,.09)}
.bm-row.on{background:rgba(93,173,226,.15);border-color:rgba(93,173,226,.45)}
.bm-row input{
  width:20px;height:20px;cursor:pointer;accent-color:var(--accent);
  flex-shrink:0;
}
.bm-name{font-size:14.5px;font-weight:600;color:var(--text)}
.bm-foot{
  padding:14px 16px;border-top:.5px solid var(--border);
  position:sticky;bottom:0;background:#0f1f33;
}
.bm-save{
  width:100%;padding:13px;
  background:var(--accent);color:#0a1421;border:none;
  border-radius:12px;font-size:15px;font-weight:700;
  cursor:pointer;font-family:inherit;
}
.bm-save:active{transform:scale(.98)}

.mode-toggle{
  display:flex;gap:0;margin:6px 14px 0;
  background:var(--card);border:.5px solid var(--border);border-radius:12px;
  padding:3px;position:sticky;top:117px;z-index:9;
}
.mode-btn{
  flex:1;padding:9px 8px;min-height:38px;
  background:transparent;border:none;
  color:var(--text-2);border-radius:9px;
  font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;
  transition:all .2s;white-space:nowrap;
}
.mode-btn[aria-pressed="true"]{
  background:var(--accent);color:#0a1421;font-weight:700;
  box-shadow:0 2px 8px rgba(93,173,226,.25);
}
@media(max-width:340px){.mode-btn{font-size:12px;padding:9px 4px}}
.tabs{
  display:flex;gap:6px;padding:10px 14px 14px;
  position:sticky;top:163px;z-index:9;
  background:rgba(10,20,33,.75);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
}
.tab{
  flex:1;padding:11px 12px;min-height:42px;
  background:var(--card);border:.5px solid var(--border);
  color:var(--text);border-radius:12px;
  font-size:14px;font-weight:600;font-family:inherit;
  cursor:pointer;transition:all .18s;
}
.tab:active{transform:scale(.97)}
.tab.active{background:var(--accent);color:#0a1421;border-color:var(--accent);font-weight:700}
main{padding:8px 14px 80px;display:flex;flex-direction:column;gap:14px}
.card{
  background:var(--card);border:.5px solid var(--border);
  border-radius:22px;padding:18px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.spot-name{font-size:24px;font-weight:700;letter-spacing:-.5px}
.cond{font-size:13px;color:var(--text-2);display:flex;align-items:center;gap:6px;margin-top:3px}
.cond span:first-child{font-size:18px;line-height:1}
.suntimes{font-size:12.5px;color:var(--text-2);display:flex;gap:10px;flex-direction:column;align-items:flex-end}
.suntimes b{font-weight:600;color:var(--text)}

/* === מטריקות === */
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.row:last-child,.grid4:last-child{margin-bottom:0}
.metric{
  background:var(--card-2);border:.5px solid var(--border);
  border-radius:14px;padding:14px;
  display:flex;flex-direction:column;gap:7px;
  min-height:108px;position:relative;overflow:hidden;
}
.metric::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 85% 20%,var(--m-color,var(--accent)) 0%,transparent 65%);
  opacity:.12;pointer-events:none;
}
.m-head{
  display:flex;align-items:center;gap:6px;
  color:var(--text-2);font-size:11.5px;font-weight:600;
  letter-spacing:.4px;position:relative;
}
.m-head svg{width:15px;height:15px;flex-shrink:0;opacity:.85}
.m-val{
  font-size:34px;font-weight:800;letter-spacing:-.8px;line-height:1;
  display:flex;align-items:baseline;gap:4px;position:relative;
  color:var(--m-color,var(--text));
}
.m-unit{font-size:14px;font-weight:600;color:var(--text-2)}
.m-sub{font-size:12px;color:var(--text-2);line-height:1.35;position:relative}
.metric.uv{--m-color:var(--uv-color)}
.metric.wave{--m-color:var(--wv-color,var(--accent))}
.dir-arrow{
  display:inline-flex;align-items:center;justify-content:center;
  width:18px;height:18px;border-radius:50%;
  background:rgba(93,173,226,.15);color:var(--accent);
  margin-inline-start:5px;font-size:12px;
}

/* === שבוע === */
.week-grid{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.day-btn{
  width:100%;display:grid;
  grid-template-columns:64px 34px 1fr auto 52px;align-items:center;gap:10px;
  padding:14px;
  background:var(--card-2);border:.5px solid var(--border);
  border-radius:14px;color:var(--text);font-family:inherit;
  cursor:pointer;text-align:right;transition:all .15s;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;
  min-height:64px;
}
.day-btn>*{pointer-events:none}
.day-btn:hover,.day-btn:focus-visible{background:rgba(255,255,255,.09);border-color:rgba(93,173,226,.4)}
.day-btn:active{transform:scale(.98);background:rgba(93,173,226,.12)}
.day-namebox{display:flex;flex-direction:column;gap:2px;line-height:1.1}
.day-name{font-size:14.5px;font-weight:700;color:var(--text)}
.day-date{font-size:11px;font-weight:600;color:var(--text-3)}
.day-ico{font-size:24px;text-align:center;line-height:1}
.day-temp{font-size:17px;font-weight:700;letter-spacing:-.3px}
.day-temp-min{font-size:13px;font-weight:600;color:var(--text-2);margin-right:3px}
.day-wave{font-size:13.5px;font-weight:700;white-space:nowrap}
.day-wave.dim{color:var(--text-3);opacity:.5}
.day-score{
  font-size:16px;font-weight:800;letter-spacing:-.3px;
  color:var(--sc-color);text-align:center;
  padding:6px 0;border-radius:9px;background:rgba(0,0,0,.3);
  white-space:nowrap;
}

.day-back{
  display:inline-flex;align-items:center;gap:4px;
  padding:7px 13px;margin-bottom:12px;
  background:var(--card-2);border:.5px solid var(--border);
  color:var(--accent);border-radius:18px;
  font-size:12.5px;font-weight:600;font-family:inherit;cursor:pointer;
  transition:all .15s;
}
.day-back:hover{background:rgba(93,173,226,.15)}
.day-back:active{transform:scale(.96)}

/* === שעות סגנון Google === */
.hourly{
  display:flex;gap:0;overflow-x:auto;scrollbar-width:none;
  margin-top:14px;padding:0;background:var(--card-2);
  border:.5px solid var(--border);border-radius:16px;
  scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
}
.hourly::-webkit-scrollbar{display:none}
.hr{
  flex:0 0 auto;min-width:104px;
  padding:14px 10px;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  border-left:.5px solid var(--border);
  position:relative;
  scroll-snap-align:start;
}
.hr:last-child{border-left:none}
.hr.now{background:rgba(93,173,226,.14);border-left:2px solid var(--accent)}
.hr-time{font-size:13px;color:var(--text-3);font-weight:600;letter-spacing:.3px}
.hr.now .hr-time{color:var(--accent);font-weight:700}
.hr-wave{
  font-size:19px;font-weight:800;letter-spacing:-.3px;line-height:1;
  color:var(--wv-color,var(--text-2));
}
.hr.now .hr-wave{font-size:22px}
.hr-wave.dim{color:var(--text-3);opacity:.5;font-weight:600}
.hr-wind{
  font-size:13px;font-weight:700;line-height:1;
  color:var(--wn-color,var(--text-2));
  display:flex;align-items:center;justify-content:center;gap:3px;
}
.hr-temprow{display:flex;align-items:center;gap:5px;line-height:1}
.hr-icon{font-size:18px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
.hr-temp{font-size:15px;font-weight:600;color:var(--text-2)}
.hr-meta{display:flex;align-items:center;gap:4px;min-height:17px}
.hr-uv{
  font-size:11px;font-weight:700;color:var(--uv-color);
  padding:2px 6px;border-radius:5px;background:rgba(0,0,0,.3);line-height:1.2;
}
.hr-pop{font-size:11px;color:#7fc3ff;font-weight:600;line-height:1}

.loading,.error{text-align:center;padding:50px 20px;color:var(--text-3);font-size:14px}
.error{color:#ff9180}
.no-data{font-size:13px;color:var(--text-3);font-style:italic}
.footer{text-align:center;padding:24px 20px;font-size:10.5px;color:var(--text-3);line-height:1.7}
.footer a{color:var(--accent);text-decoration:none}

@media(min-width:680px){
  main{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:14px 20px 80px}
  .card{margin:0}
}

.uv-l{--uv-color:var(--uv-1)}
.uv-m{--uv-color:var(--uv-2)}
.uv-h{--uv-color:var(--uv-3)}
.uv-v{--uv-color:var(--uv-4)}
.uv-x{--uv-color:var(--uv-5)}
.wv-l{--wv-color:var(--wv-1)}
.wv-m{--wv-color:var(--wv-2)}
.wv-h{--wv-color:var(--wv-3)}
.wv-x{--wv-color:var(--wv-4)}
.wv-xx{--wv-color:var(--wv-5)}
</style>
</head>
<body>

<header>
  <h1><span>🌊</span> <span id="appTitle">חופים</span></h1>
  <div class="head-right">
    <div class="updated" id="updated">טוען…</div>
    <button class="lang-btn" id="langBtn" aria-label="Language">🌐 <span id="langLabel">EN</span></button>
    <button class="refresh" id="refresh" aria-label="רענן">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3.13-6.84L21 8"/><path d="M21 3v5h-5"/></svg>
    </button>
  </div>
</header>

<nav class="spot-picker" id="spotPicker"></nav>

<div class="mode-toggle" role="group" aria-label="מצב פעילות">
  <button class="mode-btn" data-mode="swim" aria-pressed="true">🏊 שחייה</button>
  <button class="mode-btn" data-mode="sup" aria-pressed="false">🛶 סאפ</button>
  <button class="mode-btn" data-mode="surf" aria-pressed="false">🏄 גלישה</button>
  <button class="mode-btn" data-mode="kayak" aria-pressed="false">🚣 קיאק</button>
</div>

<nav class="tabs" id="tabs" role="tablist">
  <button class="tab active" data-view="today" role="tab" aria-selected="true">היום</button>
  <button class="tab" data-view="week" role="tab" aria-selected="false">7 ימים</button>
</nav>

<main id="main"><div class="loading">טוען נתונים…</div></main>

<div class="footer" id="footer">
  Data: <a href="https://open-meteo.com/" target="_blank">Open-Meteo</a> · Waves `WAM/MeteoFrance` · Weather `ECMWF`
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

// סוג הרוח לעומת כיוון הספוט
// offshore = הרוח מהיבשה לים (נקייה, הכי טובה לגלישה)
// onshore = מהים ליבשה (מבחנת את הגלים, גרוע)
function windType(windDir,facing){
  const off=(facing+180)%360;
  let diff=Math.abs(windDir-off);if(diff>180)diff=360-diff;
  const wt=t('windTypes');
  if(diff<=45)return{type:'offshore',label:wt.offshore,color:'#4ade80',icon:'✨',score:1};
  if(diff<=90)return{type:'cross-off',label:wt['cross-off'],color:'#a3e635',icon:'◐',score:.7};
  if(diff<=135)return{type:'cross-on',label:wt['cross-on'],color:'#fbbf24',icon:'◑',score:.35};
  return{type:'onshore',label:wt.onshore,color:'#f87171',icon:'⚠',score:0};
}

// ציון גלישה 0-10
function surfScore(waveH,wavePer,windSpd,windDir,facing){
  if(waveH==null)return null;
  const hScore=waveH<.2?0:waveH<.4?.4:waveH<.7?.7:waveH<1.2?1:waveH<2?.85:.6;
  const pScore=!wavePer?.5:wavePer<5?.3:wavePer<7?.55:wavePer<10?.8:1;
  const wt=windType(windDir,facing);
  const spdPen=windSpd<10?1:windSpd<20?.8:windSpd<30?.55:.3;
  const wScore=wt.score*.6+spdPen*.4;
  const total=(hScore*.4+pScore*.3+wScore*.3)*10;
  return Math.round(total*10)/10;
}

// ציון שחייה במים פתוחים 0-10 — שקט = טוב
function swimScore(waveH,windSpd,sst){
  const hScore=waveH==null?.5:waveH<.2?1:waveH<.4?.85:waveH<.7?.55:waveH<1?.25:.05;
  const wScore=windSpd<8?1:windSpd<15?.8:windSpd<22?.5:windSpd<30?.25:.05;
  const tScore=sst==null?.7:sst>=22?1:sst>=19?.85:sst>=16?.6:sst>=13?.35:.15;
  const total=(hScore*.45+wScore*.35+tScore*.2)*10;
  return Math.round(total*10)/10;
}

// ציון סאפ 0-10 — רגיש מאוד לרוח, סובלני יחסית לגלים נמוכים
function supScore(waveH,windSpd,sst){
  // גלים: <0.4 מעולה, .4-.7 בסדר, .7-1.2 קשה, >1.2 לא מומלץ
  const hScore=waveH==null?.7:waveH<.3?1:waveH<.5?.85:waveH<.8?.55:waveH<1.2?.25:.05;
  // רוח: הכי קריטי לסאפ. <8 מעולה, 8-15 בסדר, 15-22 קשה, >22 מסוכן
  const wScore=windSpd<6?1:windSpd<10?.9:windSpd<15?.6:windSpd<20?.3:.05;
  // טמפ׳ מים: סאפ פחות שקוע. רק קור קיצוני מפריע
  const tScore=sst==null?.85:sst>=20?1:sst>=17?.85:sst>=14?.55:.3;
  const total=(hScore*.3+wScore*.55+tScore*.15)*10;
  return Math.round(total*10)/10;
}

// ציון קיאק 0-10 — סובלני יותר מ-SUP לרוח אבל רגיש להיסחפות
function kayakScore(waveH,windSpd,windDir,facing,sst){
  // גלים: <0.4 מעולה, <0.7 בסדר, <1 קשה, <1.5 לסירת ים מתקדם, >1.5 מסוכן
  const hScore=waveH==null?.85:waveH<.3?1:waveH<.6?.9:waveH<1?.65:waveH<1.5?.35:.1;
  // רוח: סובלני יותר מ-SUP (יושב נמוך, פחות חשיפה). <15 מעולה, 15-25 בסדר, >30 מסוכן
  const wScore=windSpd<10?1:windSpd<18?.9:windSpd<25?.6:windSpd<32?.3:.1;
  // כיוון רוח: offshore מסוכן (היסחף לים). cross/onshore בטוח
  const off=(facing+180)%360;
  let diff=Math.abs(windDir-off);if(diff>180)diff=360-diff;
  const dScore=diff<=30?.2:diff<=60?.55:diff<=120?1:.85;
  // מים: רסס בקור = לא נעים אבל לא קריטי כמו שחייה
  const tScore=sst==null?.85:sst>=20?1:sst>=16?.85:sst>=13?.55:.3;
  const total=(hScore*.35+wScore*.35+dScore*.2+tScore*.1)*10;
  return Math.round(total*10)/10;
}

function score(mode,waveH,wavePer,windSpd,windDir,facing,sst,gust){
  if(mode==='surf')return surfScore(waveH,wavePer,windSpd,windDir,facing);
  if(mode==='sup')return supScore(waveH,windSpd,sst);
  if(mode==='kayak')return kayakScore(waveH,windSpd,windDir,facing,sst);
  return swimScore(waveH,windSpd,sst);
}

// המלצת מרחק/משך טיול קיאק לפי תנאי רוח
function kayakTrip(windSpd){
  if(windSpd<10)return t('ins.tripLong');
  if(windSpd<18)return t('ins.tripMid');
  if(windSpd<25)return t('ins.tripShort');
  if(windSpd<32)return t('ins.tripExpert');
  return t('ins.tripNo');
}

function kayakWindType(windDir,facing){
  const off=(facing+180)%360;
  let diff=Math.abs(windDir-off);if(diff>180)diff=360-diff;
  if(diff<=30)return{label:t('ins.kayakBad'),color:'#f87171',icon:'⚠️',safe:false,severity:'bad'};
  if(diff<=60)return{label:t('ins.kayakWarn'),color:'#fbbf24',icon:'◑',safe:false,severity:'warn'};
  if(diff<=120)return{label:t('ins.kayakSafe'),color:'#4ade80',icon:'✨',safe:true,severity:'good'};
  return{label:t('ins.kayakSafe2'),color:'#a3e635',icon:'◐',safe:true,severity:'good'};
}

const scoreLabel=s=>{const arr=t('scoreLabels');return s<2?arr[0]:s<4?arr[1]:s<6?arr[2]:s<8?arr[3]:arr[4]};

// חלון הזמן הטוב היום לפי המצב
function bestWindow(d,dayIdx,mode){
  const wh=d.weather.hourly,mh=d.marine?.hourly;
  const start=dayIdx*24,end=Math.min(start+24,wh.time.length);
  let best={score:-1,hr:null};
  for(let i=start;i<end;i++){
    const h=parseInt(wh.time[i].slice(11,13),10);
    if(h<5||h>20)continue;
    const s=score(mode,mh?.wave_height?.[i],mh?.wave_period?.[i],wh.wind_speed_10m[i],wh.wind_direction_10m[i],d.spot.facing,mh?.sea_surface_temperature?.[i],wh.wind_gusts_10m[i]);
    if(s!=null&&s>best.score){best={score:s,hr:h,idx:i}}
  }
  return best.hr!=null?best:null;
}

const pad2=h=>String(h).padStart(2,'0');

// חלון רציף הכי ארוך עם תנאי מסוים
function findRange(wh,mh,start,end,cond){
  let bestS=-1,bestL=0,cs=-1,cl=0;
  for(let i=start;i<end;i++){
    const h=parseInt(wh.time[i].slice(11,13),10);
    if(h<6||h>19){cs=-1;cl=0;continue}
    if(cond(i,h,wh,mh)){
      if(cs<0)cs=h;cl++;
      if(cl>bestL){bestL=cl;bestS=cs}
    }else{cs=-1;cl=0}
  }
  return bestS>=0?{from:bestS,to:bestS+bestL,hours:bestL}:null;
}

// תובנות חכמות לכל ספורט ליום הנבחר
function modeInsights(mode,d,dayIdx){
  const wh=d.weather.hourly,mh=d.marine?.hourly,wd=d.weather.daily;
  const facing=d.spot.facing;
  const start=dayIdx*24,end=Math.min(start+24,wh.time.length);
  const items=[];

  const I=k=>t('ins.'+k),u=t('units'),H=`${u.hr}`;

  if(mode==='swim'){
    const calm=findRange(wh,mh,start,end,(i)=>{
      const w=mh?.wave_height?.[i];return (w==null||w<.4)&&wh.wind_speed_10m[i]<12;
    });
    if(calm)items.push({i:'🌊',k:I('calmWindow'),v:`${pad2(calm.from)}-${pad2(calm.to)} (${calm.hours}${H})`,lv:'good'});
    else items.push({i:'⚠️',k:I('condRough'),v:I('condRoughVal'),lv:'warn'});

    if(mh?.sea_surface_temperature){
      const arr=mh.sea_surface_temperature.slice(start,end).filter(x=>x!=null);
      if(arr.length){
        const avg=arr.reduce((a,b)=>a+b,0)/arr.length;
        const dur=avg>=24?I('durUnlimited'):avg>=21?I('durLong'):avg>=18?I('durMid'):avg>=15?I('durShort'):I('durCold');
        items.push({i:'💧',k:t('metric.water'),v:`${avg.toFixed(1)}° · ${I('waterAvgDur')} ${dur}`,lv:avg>=21?'good':avg>=18?'ok':'cold'});
      }
    }
    const uvMax=wd.uv_index_max[dayIdx];
    if(uvMax>=3){
      const bm=burnMin(uvMax);
      items.push({i:'☀️',k:I('radiation'),v:`UV ${uvMax.toFixed(0)} · ${t('burnMin')} ${bm} ${t('burnSuffix')}`,lv:uvMax>=8?'bad':uvMax>=6?'warn':'ok'});
    }
    items.push({i:'🌅',k:I('sunriseSwim'),v:fmtT(wd.sunrise[dayIdx]),lv:'good'});
  }

  if(mode==='sup'){
    const calm=findRange(wh,mh,start,end,(i)=>wh.wind_speed_10m[i]<12);
    if(calm)items.push({i:'🪶',k:I('lightWindWin'),v:`${pad2(calm.from)}-${pad2(calm.to)} (${calm.hours}${H})`,lv:'good'});
    const wMax=Math.round(wd.wind_speed_10m_max[dayIdx]);
    items.push({i:'💨',k:I('windMax'),v:`${wMax} ${u.kmh} · ${windTier(wMax)}`,lv:wMax<15?'good':wMax<22?'warn':'bad'});
    const i=dayIdx===0?nowIdx(wh.time):start;
    const wt=windType(wh.wind_direction_10m[i],facing);
    if(wt.type==='offshore'||wt.type==='cross-off'){
      items.push({i:'⚠️',k:I('windDir'),v:I('offshoreSupWarn'),lv:'bad'});
    }else{
      items.push({i:'✓',k:I('windDir'),v:`${wt.label} · ${I('windDirSafe')}`,lv:'good'});
    }
    if(mh?.wave_height){
      const arr=mh.wave_height.slice(start,end).filter(x=>x!=null);
      if(arr.length){const max=Math.max(...arr);items.push({i:'🌊',k:I('wavesMax'),v:fmtWaveShort(max),lv:max<.5?'good':max<.8?'ok':'warn'});}
    }
  }

  if(mode==='surf'){
    const offshore=findRange(wh,mh,start,end,(i)=>{
      const wt=windType(wh.wind_direction_10m[i],facing);
      return (wt.type==='offshore'||wt.type==='cross-off')&&wh.wind_speed_10m[i]<25;
    });
    if(offshore)items.push({i:'✨',k:I('offshoreWin'),v:`${pad2(offshore.from)}-${pad2(offshore.to)} (${offshore.hours}${H})`,lv:'good'});
    else items.push({i:'⚠️',k:t('metric.wind'),v:I('windNoOffshore'),lv:'warn'});

    if(mh?.wave_period){
      const arr=mh.wave_period.slice(start,end).filter(x=>x!=null);
      if(arr.length){
        const max=Math.max(...arr);
        const q=max<6?I('windChop'):max<9?I('mixed'):max<12?I('ground'):I('groundLong');
        items.push({i:'⏱️',k:I('periodMax'),v:`${max.toFixed(0)} ${u.sec} · ${q}`,lv:max<6?'bad':max<9?'ok':'good'});
      }
    }
    if(mh?.wave_height){
      const arr=mh.wave_height.slice(start,end).filter(x=>x!=null);
      if(arr.length){
        const max=Math.max(...arr);
        items.push({i:'🌊',k:I('heightMax'),v:fmtWaveShort(max),lv:max>=.7?'good':max>=.4?'ok':'warn'});
      }
    }
    if(mh?.wave_direction){
      const arr=mh.wave_direction.slice(start,end).filter(x=>x!=null);
      if(arr.length){
        const dir=arr[Math.floor(arr.length/2)];
        items.push({i:'🧭',k:I('waveDir'),v:`${dirText(dir)} (${Math.round(dir)}°)`,lv:'ok'});
      }
    }
  }

  if(mode==='kayak'){
    const calm=findRange(wh,mh,start,end,(i)=>{
      const w=mh?.wave_height?.[i];
      return wh.wind_speed_10m[i]<20&&(w==null||w<.7);
    });
    if(calm)items.push({i:'🚣',k:I('paddleWin'),v:`${pad2(calm.from)}-${pad2(calm.to)} (${calm.hours}${H})`,lv:'good'});
    else items.push({i:'⚠️',k:I('condRoughKayak'),v:I('condRoughVal2'),lv:'warn'});

    const wMax=Math.round(wd.wind_speed_10m_max[dayIdx]);
    const trip=kayakTrip(wMax);
    items.push({i:'💨',k:I('windMax'),v:`${wMax} ${u.kmh} · ${windTier(wMax)}`,lv:wMax<15?'good':wMax<22?'ok':wMax<30?'warn':'bad'});
    items.push({i:'📏',k:I('tripRec'),v:trip,lv:wMax<18?'good':wMax<25?'ok':wMax<32?'warn':'bad'});

    const i=dayIdx===0?nowIdx(wh.time):start;
    const kwt=kayakWindType(wh.wind_direction_10m[i],facing);
    items.push({i:kwt.icon,k:I('windDir'),v:kwt.label,lv:kwt.severity});

    if(mh?.wave_height){
      const arr=mh.wave_height.slice(start,end).filter(x=>x!=null);
      if(arr.length){
        const max=Math.max(...arr);
        items.push({i:'🌊',k:I('wavesMax'),v:fmtWaveShort(max),lv:max<.6?'good':max<1?'ok':max<1.5?'warn':'bad'});
      }
    }

    if(mh?.sea_surface_temperature){
      const arr=mh.sea_surface_temperature.slice(start,end).filter(x=>x!=null);
      if(arr.length){
        const avg=arr.reduce((a,b)=>a+b,0)/arr.length;
        if(avg<18)items.push({i:'🥶',k:I('coldWater'),v:`${avg.toFixed(1)}° — ${I('coldWaterSuffix')}`,lv:avg<15?'bad':'warn'});
      }
    }
  }

  return items;
}
function wmoIcon(c,isDay=true){
  if(c===0)return isDay?'☀️':'🌙';
  if(c<=2)return isDay?'🌤️':'🌙';
  if(c===3)return '☁️';
  if(c===45||c===48)return '🌫️';
  if(c>=51&&c<=57)return '🌦️';
  if(c>=61&&c<=67)return '🌧️';
  if(c>=71&&c<=77)return '❄️';
  if(c>=80&&c<=82)return '🌧️';
  if(c>=85&&c<=86)return '🌨️';
  if(c>=95)return '⛈️';
  return '🌤️';
}
const isDayHour=h=>h>=6&&h<19;

function nowIdx(times){
  const n=new Date();
  const target=`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}T${String(n.getHours()).padStart(2,'0')}:00`;
  const i=times.findIndex(t=>t>=target);
  return i<0?0:i;
}

function uvInsights(uvArr,times,idx){
  const today=times[idx].slice(0,10);
  let pi=idx,si=-1;
  for(let i=idx;i<times.length&&times[i].slice(0,10)===today;i++){
    if(uvArr[i]>uvArr[pi])pi=i;
  }
  for(let i=pi;i<times.length&&times[i].slice(0,10)===today;i++){
    if(uvArr[i]<3){si=i;break;}
  }
  return{peakTime:fmtT(times[pi]),peakVal:uvArr[pi],safeTime:si>0?fmtT(times[si]):null};
}

async function fetchSpot(spot){
  const wUrl=`https://api.open-meteo.com/v1/forecast?latitude=${spot.lat}&longitude=${spot.lon}&hourly=temperature_2m,wind_speed_10m,wind_gusts_10m,wind_direction_10m,uv_index,weather_code,precipitation_probability&daily=temperature_2m_max,temperature_2m_min,uv_index_max,wind_speed_10m_max,weather_code,sunrise,sunset&timezone=Asia/Jerusalem&forecast_days=7&wind_speed_unit=kmh`;
  const model=spot.sea==='red'?'&models=gwam':'';
  const mUrl=`https://marine-api.open-meteo.com/v1/marine?latitude=${spot.lat}&longitude=${spot.lon}&hourly=wave_height,wave_direction,wave_period,swell_wave_height,swell_wave_period,sea_surface_temperature&daily=wave_height_max,wave_direction_dominant,wave_period_max&timezone=Asia/Jerusalem&forecast_days=7${model}`;
  const[weather,marine]=await Promise.all([
    fetch(wUrl).then(r=>r.json()),
    fetch(mUrl).then(r=>r.ok?r.json():null).catch(()=>null)
  ]);
  return{spot,weather,marine:marine||null};
}

async function loadAll(force=false){

  try{

    const ts=Date.now();
    localStorage.setItem(CACHE_KEY,JSON.stringify({data,ts}));

  }

  const uvBox=`<div class="metric uv ${uvCls(uvMax)}">
    <div class="m-head"><svg><use href="#i-sun"/></svg>${t('metric.uvMax')}</div>
    <div class="m-val">${Math.round(uvMax)}<span class="m-unit">${uvIcon(uvMax)}</span></div>
    <div class="m-sub">${uvTier(uvMax)}${insights?.peakTime?` · ${t('peak')} ${insights.peakTime}`:''}</div>
  </div>`;

  let sstAvg=null;
  if(mh?.sea_surface_temperature){
    const slice=mh.sea_surface_temperature.slice(dayStart,dayStart+24).filter(x=>x!=null);
    if(slice.length)sstAvg=slice.reduce((a,b)=>a+b,0)/slice.length;
  }
  const waterBox=sstAvg!=null
    ?`<div class="metric" style="--m-color:#5dade2"><div class="m-head"><svg><use href="#i-water"/></svg>${t('metric.water')}</div><div class="m-val">${sstAvg.toFixed(1)}<span class="m-unit">°</span></div><div class="m-sub">${t('metric.avgDay')}</div></div>`
    :`<div class="metric"><div class="m-head"><svg><use href="#i-water"/></svg>${t('metric.water')}</div><div class="m-val">—</div></div>`;

  const windBox=`<div class="metric ${windCls(windMax)}" style="--m-color:var(--wn-color)">
    <div class="m-head"><svg><use href="#i-wind"/></svg>${t('metric.windMax')}</div>
    <div class="m-val">${windMax}<span class="m-unit">${u.kmh}</span></div>
    <div class="m-sub">${windTier(windMax)}</div>
  </div>`;

  const backBtn=!isToday?`<button class="day-back" data-back="1" aria-label="${t('backToday')}">${t('backToday')}</button>`:'';

  return `<div class="card">
    <div class="card-head">
      <div>
        <div class="spot-name">${spotName(spot)}</div>
        <div class="cond">${dayLabel} · ${tMax}°/${tMin}°${!isToday?` · ${wmoText(wd.weather_code?.[dayIdx]??1)}`:''}</div>
      </div>
      <div class="suntimes"><span>${t('metric.sunrise')} <b>${sunrise}</b></span><span>${t('metric.sunset')} <b>${sunset}</b></span></div>
    </div>
    ${backBtn}
    ${isToday?surfHero(d,i):''}
    ${renderInsights(d,dayIdx)}
    <div class="grid4">
      ${waveBox}
      ${waterBox}
      ${windBox}
      ${uvBox}
    </div>
    <div class="hourly">${hours}</div>
  </div>`;
}

function renderWeek(d){
  const{spot,weather,marine}=d;
  const wd=weather.daily,md=marine?.daily;
  let days='';
  for(let i=0;i<7;i++){
    const date=new Date(wd.time[i]);
    const dn=i===0?t('today'):i===1?t('tomorrow'):DAY_NAMES()[date.getDay()];
    const dStr=`${date.getDate()}/${date.getMonth()+1}`;
    const tMax=Math.round(wd.temperature_2m_max[i]),tMin=Math.round(wd.temperature_2m_min[i]);
    const wMax=md?md.wave_height_max?.[i]:null;
    const code=wd.weather_code?.[i]??1;
    const waveStr=wMax!=null?fmtWaveShort(wMax):null;
    const win=bestWindow(d,i,mode);
    const sc=win?win.score:null;
    days+=`<button class="day-btn" data-day="${i}" aria-label="${dn} ${dStr}">
      <div class="day-namebox">
        <span class="day-name">${dn}</span>
        <span class="day-date">${dStr}</span>
      </div>
      <div class="day-ico">${wmoIcon(code,true)}</div>
      <div class="day-temp">${tMax}°<span class="day-temp-min">/${tMin}°</span></div>
      ${waveStr?`<div class="day-wave ${waveCls(wMax)}" style="color:var(--wv-color)">🌊 ${waveStr}</div>`:'<div class="day-wave dim">—</div>'}
      ${sc!=null?`<div class="day-score ${scoreCls(sc)}">${sc.toFixed(1)}</div>`:'<div class="day-score">—</div>'}
    </button>`;
  }
  return `<div class="card">
    <div class="card-head">
      <div>
        <div class="spot-name">${spotName(spot)}</div>
        <div class="cond">${t('score.'+mode)} · ${t('pressGuide')}</div>
      </div>
    </div>
    <div class="week-grid">${days}</div>
  </div>`;
}

function updateTodayTabLabel(data){
  const tab=document.querySelector('.tab[data-view="today"]');
  if(!tab)return;
  if(selectedDay===0){tab.textContent=t('today');return}
  const d=data.find(x=>x.spot.id===selectedSpot)||data[0];
  const dt=new Date(d.weather.daily.time[selectedDay]);
  tab.textContent=selectedDay===1?t('tomorrow'):`${DAY_NAMES()[dt.getDay()]} ${dt.getDate()}/${dt.getMonth()+1}`;
}

const spotName=s=>s[lang==='en'?'name_en':'name']||s.name;

function render(data,ts,note){
  const view=document.querySelector('.tab.active').dataset.view;
  const fn=view==='week'?renderWeek:renderToday;
  const d=data.find(x=>x.spot.id===selectedSpot)||data[0];
  document.getElementById('main').innerHTML=fn(d);
  updateTodayTabLabel(data);
  const dt=new Date(ts);
  const tStr=String(dt.getHours()).padStart(2,'0')+':'+String(dt.getMinutes()).padStart(2,'0');
  document.getElementById('updated').innerHTML=(note?note+'<br>':'')+t('updated')+' '+tStr;
  const nowHr=document.querySelector('.hr.now');
  if(nowHr)nowHr.scrollIntoView({inline:'center',block:'nearest',behavior:'instant'});
}

function buildSpotPicker(){
  const el=document.getElementById('spotPicker');
  el.setAttribute('role','tablist');
  el.setAttribute('aria-label',t('spotPicker'));
  const items=SPOTS.map(s=>{
    const act=s.id===selectedSpot;
    const nm=spotName(s);
    return `<button class="spot-btn${act?' active':''}" data-spot="${s.id}" role="tab" aria-selected="${act}" aria-label="${nm}">${nm}</button>`;
  }).join('');
  el.innerHTML=items+`<button class="spot-btn spot-edit" id="editBeaches" aria-label="${t('editBeaches')}">${t('addBeaches')}</button>`;
}

function openBeachManager(){
  let dlg=document.getElementById('beachManager');
  if(dlg){dlg.showModal();return}
  dlg=document.createElement('dialog');
  dlg.id='beachManager';
  dlg.className='beach-mgr';
  const selected=new Set(SPOTS.map(s=>s.id));
  const groups={};
  for(const b of ALL_BEACHES){(groups[b.region]=groups[b.region]||[]).push(b)}
  const regions=t('regions');
  const body=Object.keys(groups).map(r=>`
    <div class="bm-section">
      <div class="bm-region">${regions[r]||r}</div>
      ${groups[r].map(b=>`
        <label class="bm-row${selected.has(b.id)?' on':''}">
          <input type="checkbox" data-bid="${b.id}" ${selected.has(b.id)?'checked':''}>
          <span class="bm-name">${spotName(b)}</span>
        </label>
      `).join('')}
    </div>
  `).join('');
  dlg.innerHTML=`
    <div class="bm-head">
      <h2>${t('beachManager')}</h2>
      <button class="bm-close" aria-label="${t('close')}">✕</button>
    </div>
    <div class="bm-body">${body}</div>
    <div class="bm-foot">
      <button class="bm-save">${t('save')}</button>
    </div>`;
  document.body.appendChild(dlg);
  dlg.showModal();
  dlg.addEventListener('click',e=>{
    if(e.target===dlg||e.target.classList.contains('bm-close'))dlg.close();
    if(e.target.classList.contains('bm-save')){
      const ids=[...dlg.querySelectorAll('input:checked')].map(i=>i.dataset.bid);
      if(!ids.length){alert(t('selectAtLeast'));return}
      saveSelectedSpotIds(ids);
      SPOTS=ids.map(id=>ALL_BEACHES.find(b=>b.id===id)).filter(Boolean);
      if(!SPOTS.find(s=>s.id===selectedSpot)){selectedSpot=SPOTS[0].id;localStorage.setItem(SPOT_KEY,selectedSpot)}
      buildSpotPicker();
      dlg.close();
      loadAll(true);
    }
  });
  dlg.addEventListener('change',e=>{
    const row=e.target.closest('.bm-row');
    if(row)row.classList.toggle('on',e.target.checked);
  });
}

function renderFromCache(){
  const cached=localStorage.getItem(CACHE_KEY);
  if(cached){try{const{data,ts}=JSON.parse(cached);render(data,ts)}catch{}}
}

function applyMode(){
  document.querySelectorAll('.mode-btn').forEach(b=>{
    b.setAttribute('aria-pressed',b.dataset.mode===mode);
    b.innerHTML=t(b.dataset.mode);
  });
}

function applyLang(){
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==='he'?'rtl':'ltr';
  document.getElementById('appTitle').textContent=t('title');
  document.getElementById('langLabel').textContent=lang==='he'?'EN':'עברית';
  document.title=`${t('title')} — ${t('subtitle')}`;
  document.querySelector('header h1').setAttribute('aria-label',t('title'));
  document.getElementById('refresh').setAttribute('aria-label',t('refresh'));
  // Tabs
  const tabs=document.querySelectorAll('.tab');
  if(tabs[0])tabs[0].textContent=t('today');
  if(tabs[1])tabs[1].textContent=t('week');
  document.getElementById('tabs').setAttribute('aria-label',t('tabRange'));
  // Mode toggle
  document.querySelector('.mode-toggle').setAttribute('aria-label',t('modePicker'));
  // Loading text
  const loading=document.querySelector('.loading');
  if(loading)loading.textContent=t('loading');
  applyMode();
  buildSpotPicker();
}

document.querySelectorAll('.mode-btn').forEach(b=>{
  b.addEventListener('click',()=>{
    mode=b.dataset.mode;
    localStorage.setItem(MODE_KEY,mode);
    applyMode();
    renderFromCache();
  });
});

document.getElementById('langBtn').addEventListener('click',()=>{
  lang=lang==='he'?'en':'he';
  localStorage.setItem(LANG_KEY,lang);
  applyLang();
  renderFromCache();
});

document.getElementById('spotPicker').addEventListener('click',e=>{
  const btn=e.target.closest('.spot-btn');if(!btn)return;
  if(btn.id==='editBeaches'){openBeachManager();return}
  selectedSpot=btn.dataset.spot;
  localStorage.setItem(SPOT_KEY,selectedSpot);
  document.querySelectorAll('.spot-btn').forEach(b=>{
    const a=b.dataset.spot===selectedSpot;
    b.classList.toggle('active',a);b.setAttribute('aria-selected',a);
  });
  renderFromCache();
});

document.getElementById('tabs').addEventListener('click',e=>{
  if(!e.target.classList.contains('tab'))return;
  document.querySelectorAll('.tab').forEach(t=>{
    const a=t===e.target;
    t.classList.toggle('active',a);t.setAttribute('aria-selected',a);
  });
  if(e.target.dataset.view!=='today')selectedDay=0;
  renderFromCache();
});

document.getElementById('main').addEventListener('click',e=>{
  const dayBtn=e.target.closest('.day-btn');
  if(dayBtn){
    selectedDay=parseInt(dayBtn.dataset.day,10)||0;
    document.querySelectorAll('.tab').forEach(t=>{
      const a=t.dataset.view==='today';
      t.classList.toggle('active',a);t.setAttribute('aria-selected',a);
    });
    renderFromCache();
    return;
  }
  if(e.target.closest('.day-back')){
    selectedDay=0;
    renderFromCache();
  }
});

document.getElementById('refresh').addEventListener('click',e=>{
  const btn=e.currentTarget;btn.classList.add('spin');
  loadAll(true).finally(()=>setTimeout(()=>btn.classList.remove('spin'),400));
});

let touchStart=0,pulling=false;
document.addEventListener('touchstart',e=>{if(window.scrollY===0)touchStart=e.touches[0].clientY},{passive:true});
document.addEventListener('touchmove',e=>{
  if(window.scrollY===0&&e.touches[0].clientY-touchStart>80&&!pulling){pulling=true;document.getElementById('refresh').click()}
},{passive:true});
document.addEventListener('touchend',()=>{pulling=false});

applyLang();
loadAll();
setInterval(()=>loadAll(),30*60*1000);
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(reg=>{
    // בודק עדכון בכל פתיחה
    reg.update();
    // אם נמצא sw חדש — הפעל אותו מיד ורענן
    reg.addEventListener('updatefound',()=>{
      const nw=reg.installing;
      if(!nw)return;
      nw.addEventListener('statechange',()=>{
        if(nw.state==='installed'&&navigator.serviceWorker.controller){
          nw.postMessage('skipWaiting');
        }
      });
    });
    // כש-sw חדש לקח שליטה — רענן את הדף
    let refreshing=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{
      if(refreshing)return;refreshing=true;
      location.reload();
    });
  }).catch(()=>{});
}
</script>
</body>
</html>
